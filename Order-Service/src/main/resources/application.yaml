spring:
  application:
    name: order-service

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: order-reconciliation-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

  datasource:
    url: jdbc:postgresql://localhost:5433/orderdb #jdbc:postgresql://postgres-order:5432/orderdb
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

management:
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: w3c
  otlp:
    metrics:
      export:
        enabled: false
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name}
      service.namespace: gamesstore
      deployment.environment: local
    tracing:
      export:
        otlp:
          endpoints: http://localhost:4318/v1/traces
          protocol: http/protobuf
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

server:
  port: 0

eureka:
  instance:
    instance-id: ${spring.application.name}:${random.value}
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/ #http://eureka:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

integration:
  product:
    base-url: http://PRODUCT-SERVICE
  payment:
    base-url: http://PAYMENT-SERVICE