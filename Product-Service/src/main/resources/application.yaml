spring:
  application:
    name: product-service
  elasticsearch:
    uris: http://product-elasticsearch:9200/

server:
  port: 0

eureka:
  instance:
    instance-id: ${spring.application.name}:${random.value}
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://eureka:8761/eureka/

management:
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: w3c
  otlp:
    metrics:
      export:
        enabled: false
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name}
      service.namespace: gamesstore
      deployment.environment: local
    tracing:
      export:
        otlp:
          endpoints: http://otel-collector:4318/v1/traces
          protocol: http/protobuf