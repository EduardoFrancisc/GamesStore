version: '3.8'
services:
  product-elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.8
    container_name: product-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9201:9200"

  elasticsearch-seeder:
    image: curlimages/curl:8.4.0
    container_name: elasticsearch-seeder
    profiles: ["seed"]
    depends_on:
      - product-elasticsearch
    volumes:
      - ./init-data.sh:/init-data.sh
    command: ["/bin/sh", "/init-data.sh"]

