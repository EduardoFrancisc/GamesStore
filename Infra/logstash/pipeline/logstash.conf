input {
    tcp {
        port => 5000
        codec => json_lines
    }
}

filter {
    mutate {
        add_field => {
            "stack" => "gamesstore"
        }
    }
}

output {
    elasticsearch {
        hosts => ["http://elasticsearch-logs:9200"]
        index => "gamesstore-logs-%{+YYYY.MM.dd}"
    }
}